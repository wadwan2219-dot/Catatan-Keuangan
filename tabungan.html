<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SaldoKu - Input Tabungan</title>
  <meta name="description" content="Tambah saldo tabungan dan pemasukan uang Anda secara cepat.">
  
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Firebase SDK Compat -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

  <!-- Custom Styles -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="pb-16">

  <!-- Top Navigation Bar -->
  <header class="sticky top-0 z-50 backdrop-blur-md bg-slate-900/70 border-b border-slate-800">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
      
      <!-- Brand Logo -->
      <a href="dashboard.html" class="flex items-center gap-2.5">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-600 to-emerald-500 flex items-center justify-center text-white shadow-md shadow-indigo-500/20">
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z" />
          </svg>
        </div>
        <span class="text-lg font-bold text-white tracking-tight">Saldo<span class="text-emerald-400">Ku</span></span>
      </a>

      <!-- Navigation Links -->
      <nav class="hidden md:flex items-center gap-6">
        <a href="dashboard.html" class="nav-link text-sm text-slate-300 hover:text-white">Dashboard</a>
        <a href="tabungan.html" class="nav-link active text-sm">Tabungan</a>
        <a href="belanja.html" class="nav-link text-sm text-slate-300 hover:text-white">Pengeluaran</a>
        <a href="hutang.html" class="nav-link text-sm text-slate-300 hover:text-white">Hutang Bersih</a>
        <a href="riwayat.html" class="nav-link text-sm text-slate-300 hover:text-white">Riwayat</a>
      </nav>

      <!-- User Profile & Logout -->
      <div class="flex items-center gap-3">
        <button id="btn-logout" title="Keluar Akun" class="flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-rose-500/10 text-rose-400 hover:bg-rose-500/20 border border-rose-500/20 transition-all text-xs font-semibold">
          <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
          </svg>
          <span class="hidden sm:inline">Keluar</span>
        </button>
      </div>

    </div>
  </header>

  <!-- Mobile Bottom Nav -->
  <div class="md:hidden fixed bottom-0 left-0 right-0 z-50 bg-slate-900/90 backdrop-blur-lg border-t border-slate-800 px-3 py-2 flex justify-around">
    <a href="dashboard.html" class="flex flex-col items-center text-slate-400 hover:text-indigo-400">
      <svg class="w-5 h-5 mb-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
      </svg>
      <span class="text-[10px] font-semibold">Home</span>
    </a>
    <a href="tabungan.html" class="flex flex-col items-center text-emerald-400 font-bold">
      <svg class="w-5 h-5 mb-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6" />
      </svg>
      <span class="text-[10px] font-semibold">Tabungan</span>
    </a>
    <a href="belanja.html" class="flex flex-col items-center text-slate-400 hover:text-rose-400">
      <svg class="w-5 h-5 mb-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 12H4" />
      </svg>
      <span class="text-[10px] font-semibold">Pengeluaran</span>
    </a>
    <a href="hutang.html" class="flex flex-col items-center text-slate-400 hover:text-indigo-400">
      <svg class="w-5 h-5 mb-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4" />
      </svg>
      <span class="text-[10px] font-semibold">Hutang</span>
    </a>
    <a href="riwayat.html" class="flex flex-col items-center text-slate-400 hover:text-indigo-400">
      <svg class="w-5 h-5 mb-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
      </svg>
      <span class="text-[10px] font-semibold">Riwayat</span>
    </a>
  </div>

  <!-- Main Container -->
  <main class="max-w-3xl mx-auto px-4 sm:px-6 pt-8 space-y-6">

    <!-- Page Header -->
    <div class="flex items-center justify-between">
      <div>
        <a href="dashboard.html" class="text-xs text-indigo-400 hover:underline mb-1 inline-block">← Kembali ke Dashboard</a>
        <h1 class="text-2xl sm:text-3xl font-extrabold text-white tracking-tight">
          Catat Tabungan
        </h1>
        <p class="text-xs sm:text-sm text-slate-400 mt-1">Tambahkan catatan pemasukan dana ke dalam saldo.</p>
      </div>
    </div>

    <!-- MAIN FORM CARD -->
    <div class="glass-card p-6 sm:p-8 glow-emerald relative overflow-hidden">
      
      <form id="form-tabungan" class="space-y-6">
        
        <!-- Nominal Input & Presets -->
        <div>
          <label for="tabungan-nominal" class="block text-xs font-bold uppercase tracking-wider text-emerald-400 mb-2">
            Nominal Tabungan (Rp) *
          </label>
          <div class="relative">
            <span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 font-bold text-lg">Rp</span>
            <input type="text" id="tabungan-nominal" required placeholder="0"
                   class="w-full pl-12 pr-4 py-3.5 rounded-xl bg-slate-900/80 border border-emerald-500/40 text-emerald-300 text-xl font-bold placeholder-slate-600 focus:outline-none focus:border-emerald-400 focus:ring-2 focus:ring-emerald-500/30 transition-all">
          </div>

          <!-- Presets -->
          <div class="mt-3">
            <span class="text-[11px] font-semibold text-slate-400 block mb-2">Nominal Cepat:</span>
            <div class="flex flex-wrap gap-2">
              <button type="button" data-amount="100000" class="preset-tabungan preset-btn">+100 Rb</button>
              <button type="button" data-amount="250000" class="preset-tabungan preset-btn">+250 Rb</button>
              <button type="button" data-amount="500000" class="preset-tabungan preset-btn">+500 Rb</button>
              <button type="button" data-amount="1000000" class="preset-tabungan preset-btn">+1 Juta</button>
            </div>
          </div>
        </div>

        <!-- Keterangan Input -->
        <div>
          <label for="tabungan-keterangan" class="block text-xs font-bold uppercase tracking-wider text-slate-300 mb-2">
            Keterangan / Sumber Pemasukan
          </label>
          <input type="text" id="tabungan-keterangan" placeholder="Contoh: Gaji bulanan, transfer, pemasukan usaha"
                 class="w-full px-4 py-3 rounded-xl bg-slate-900/80 border border-slate-700/70 text-slate-100 text-sm placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition-all">
        </div>

        <!-- Tanggal Input -->
        <div>
          <label for="tabungan-tanggal" class="block text-xs font-bold uppercase tracking-wider text-slate-300 mb-2">
            Tanggal Transaksi
          </label>
          <input type="date" id="tabungan-tanggal" required
                 class="w-full px-4 py-3 rounded-xl bg-slate-900/80 border border-slate-700/70 text-slate-100 text-sm focus:outline-none focus:border-indigo-500 transition-all">
        </div>

        <!-- Real-Time Balance Preview Box -->
        <div class="p-4 rounded-xl bg-slate-900/90 border border-slate-800 flex items-center justify-between">
          <div>
            <span class="text-xs text-slate-400 block">Saldo Saat Ini: <strong id="val-current-saldo" class="text-slate-200">Rp 0</strong></span>
            <span class="text-xs text-emerald-400 font-semibold mt-0.5 block">Estimasi Saldo Akhir:</span>
          </div>
          <div id="preview-new-saldo" class="text-xl font-black text-emerald-400">
            Rp 0
          </div>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="w-full py-3.5 bg-gradient-to-r from-emerald-600 to-emerald-500 hover:from-emerald-500 hover:to-emerald-400 text-white font-bold text-sm rounded-xl shadow-lg shadow-emerald-600/30 transition-all transform active:scale-95 flex items-center justify-center gap-2">
          Simpan Tabungan
        </button>

      </form>

    </div>

  </main>

  <!-- JavaScript Modules -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/common.js"></script>
  <script src="js/tabungan.js"></script>
</body>
</html>
